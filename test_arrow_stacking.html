<!DOCTYPE html>
<html>
<head>
    <title>Arrow Stacking Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { background: #2a2a2a; padding: 15px; margin: 10px 0; border-left: 3px solid #4caf50; }
        .pass { border-left-color: #4caf50; }
        .fail { border-left-color: #f44336; }
        pre { background: #333; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🎯 Arrow Stacking Test</h1>
    
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function log(test, passed, details) {
            const div = document.createElement('div');
            div.className = `test ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `
                <h3>${passed ? '✅' : '❌'} ${test}</h3>
                <pre>${details}</pre>
            `;
            results.appendChild(div);
        }
        
        // THE ACTUAL FUNCTION FROM THE CODE
        function isStackable(item) {
            const stackableCategories = ['consumable', 'misc'];
            const stackableNames = ['arrow', 'bolt', 'ration', 'coin', 'potion', 'scroll', 'ammunition'];
            const nameLower = (item.name || '').toLowerCase();
            return stackableCategories.includes(item.category) || 
                   stackableNames.some(s => nameLower.includes(s));
        }
        
        // Test 1: Basic Arrow
        const arrow1 = {
            name: "+1 Arrow",
            category: "misc",
            weight: 0.05
        };
        
        const isArrowStackable = isStackable(arrow1);
        log(
            'Test 1: Is "+1 Arrow" with category "misc" stackable?',
            isArrowStackable === true,
            `Result: ${isArrowStackable}\nItem: ${JSON.stringify(arrow1, null, 2)}`
        );
        
        // Test 2: Add two arrows to bag
        let bagOfHolding = [];
        
        const arrow2 = { name: "+1 Arrow", category: "misc", weight: 0.05, quantity: 1 };
        bagOfHolding.push(arrow2);
        
        log(
            'Test 2: Added first arrow',
            bagOfHolding.length === 1,
            `Bag contents:\n${JSON.stringify(bagOfHolding, null, 2)}`
        );
        
        // Test 3: Try to add second arrow (simulate the add logic)
        const arrow3 = { name: "+1 Arrow", category: "misc", weight: 0.05, quantity: 1 };
        
        const existingIndex = bagOfHolding.findIndex(function(existing) {
            const match = existing.name === arrow3.name && 
                   (existing.rarity || '') === (arrow3.rarity || '') &&
                   isStackable(existing);
            return match;
        });
        
        log(
            'Test 3: Finding existing arrow',
            existingIndex === 0,
            `existingIndex: ${existingIndex}\nLooking for: ${JSON.stringify(arrow3, null, 2)}`
        );
        
        if (existingIndex >= 0 && isStackable(arrow3)) {
            const existing = bagOfHolding[existingIndex];
            existing.quantity = (parseInt(existing.quantity) || 1) + 1;
            log(
                'Test 4: Stacked arrow',
                existing.quantity === 2,
                `New quantity: ${existing.quantity}\n${JSON.stringify(bagOfHolding, null, 2)}`
            );
        } else {
            bagOfHolding.push(arrow3);
            log(
                'Test 4: Created new stack (WRONG!)',
                false,
                `Bag now has ${bagOfHolding.length} items\n${JSON.stringify(bagOfHolding, null, 2)}`
            );
        }
        
        // Test 5: consolidateStacks
        function consolidateStacks(items) {
            const consolidated = [];
            const seen = new Map();
            
            items.forEach(function(item) {
                if (!item || !item.name) return;
                const key = item.name + '|' + (item.rarity || '') + '|' + (isStackable(item) ? 'stackable' : 'unique');
                
                if (isStackable(item) && seen.has(key)) {
                    const existing = seen.get(key);
                    existing.quantity = (parseInt(existing.quantity) || 1) + (parseInt(item.quantity) || 1);
                } else {
                    const itemCopy = JSON.parse(JSON.stringify(item));
                    if (isStackable(itemCopy) && !itemCopy.quantity) {
                        itemCopy.quantity = 1;
                    }
                    consolidated.push(itemCopy);
                    if (isStackable(itemCopy)) {
                        seen.set(key, itemCopy);
                    }
                }
            });
            
            return consolidated;
        }
        
        // Create a bag with duplicates
        let testBag = [
            { name: "+1 Arrow", category: "misc", weight: 0.05, quantity: 3 },
            { name: "+1 Arrow", category: "misc", weight: 0.05, quantity: 2 },
            { name: "Longsword", category: "weapon", weight: 3 },
            { name: "Longsword", category: "weapon", weight: 3 }
        ];
        
        log(
            'Test 5: Before consolidation',
            testBag.length === 4,
            `${testBag.length} items:\n${JSON.stringify(testBag, null, 2)}`
        );
        
        const consolidated = consolidateStacks(testBag);
        
        log(
            'Test 6: After consolidation',
            consolidated.length === 3 && consolidated[0].quantity === 5,
            `${consolidated.length} items (should be 3: 1 arrow stack + 2 swords):\n${JSON.stringify(consolidated, null, 2)}`
        );
    </script>
</body>
</html>
